<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Catch the Buey @ Mahidol</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Catch the <span class="highlight">Buey</span>! 🦎</h1>
  <h2>จับน้องให้ทันก่อนเวลาหมด! | คะแนน: <span class="score">0</span></h2>

      <button onClick="startGame()">เริ่มเกม!</button>
      <div id="time-left">เวลา: 10 วินาที</div>
  </div>

  <div class="game">
    <div class="hole hole1"><div class="mole"></div></div>
    <div class="hole hole2"><div class="mole"></div></div>
    <div class="hole hole3"><div class="mole"></div></div>
    <div class="hole hole4"><div class="mole"></div></div>
    <div class="hole hole5"><div class="mole"></div></div>
    <div class="hole hole6"><div class="mole"></div></div>
  </div>

<script src="script.js"></script>
</body>
</html>
